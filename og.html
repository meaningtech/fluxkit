<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Fluxkit card</title>
  <style>
    @font-face {
      font-family: "Martian Mono";
      src: url("fonts/martian-mono.woff2") format("woff2");
      font-weight: 100 800;
      font-stretch: 75% 112.5%;
    }
    html, body { margin: 0; background: #000; }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: radial-gradient(36rem 22rem at 50% 30%, rgba(255,255,255,.09), transparent 70%), #000;
      font-family: "Martian Mono", monospace;
      color: #ececec;
    }
    svg { width: 150px; height: auto; overflow: visible; }
    line { stroke: #fff; stroke-width: 7; stroke-linecap: round; filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 16px rgba(255,255,255,.85)); }
    circle { fill: #fff; filter: drop-shadow(0 0 8px #fff); }
    p { margin: 0; }
    .quote { margin-top: 34px; font-size: 34px; font-stretch: 100%; font-weight: 400; letter-spacing: -.01em; }
    .cite { margin-top: 12px; font-size: 14px; font-stretch: 100%; letter-spacing: .2em; text-transform: uppercase; color: #6b6b6b; }
    .tools { margin-top: 40px; font-size: 19px; font-stretch: 87.5%; letter-spacing: .04em; color: #a8a8a8; }
    .tools span { color: #34373c; padding: 0 .35em; }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 200 230" aria-hidden="true">
      <line x1="100" y1="18" x2="100" y2="108"/>
      <line x1="100" y1="108" x2="28" y2="208"/>
      <line x1="100" y1="108" x2="172" y2="208"/>
      <circle cx="100" cy="108" r="6"/>
      <circle cx="100" cy="18" r="5"/>
      <circle cx="28" cy="208" r="5"/>
      <circle cx="172" cy="208" r="5"/>
    </svg>
    <p class="quote">“Where we're going, we don't need roads.”</p>
    <p class="cite">Back to the Future</p>
    <p class="tools">scott<span>·</span>doc<span>·</span>grog<span>·</span>devo<span>·</span>hush<span>·</span>argo<span>·</span>ambox<span>·</span>mcaifee<span>·</span>pastazzo</p>
  </div>
</body>
</html>
