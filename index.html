<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluxkit</title>
  <meta name="description" content="Fluxkit is a toolkit of five agents for developers: grog, devo, hush, argo, and ambox.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: #efe8dc;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      background-color: #3a2618;
      background-image:
        radial-gradient(120% 90% at 50% 42%, transparent 45%, rgba(0,0,0,.55)),
        repeating-linear-gradient(180deg,
          rgba(255,255,255,.045) 0 1px,
          transparent 1px 3px,
          transparent 3px 7px),
        repeating-linear-gradient(180deg,
          #2a1a10 0px,
          #3d2818 1px,
          #5a3b24 3px,
          #3a2416 6px,
          #2a1a10 8px);
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    a:focus-visible, button:focus-visible {
      outline: 2px solid #ffe14a;
      outline-offset: 3px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 16px 0 0;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #d7c4ae;
    }
    .top a { color: inherit; text-decoration: none; }
    .top a:hover { color: #fff; }
    .scene {
      min-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 12px 16px 28px;
    }
    .bench {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: min(1040px, 100%);
    }
    .circuit {
      width: min(680px, 62%);
      padding: 14px;
      background: linear-gradient(180deg, #f7f4ef, #d7d1c8 70%, #c9c2b8);
      border-radius: 18px;
      box-shadow: 0 18px 28px rgba(0,0,0,.38), inset 0 1px 0 #fff;
    }
    .screen {
      background:
        linear-gradient(180deg, rgba(255,255,255,.07), transparent 28%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
        linear-gradient(180deg, #46515b, #1a2026 60%, #2c353d);
      border: 8px solid #0e1013;
      padding: 8px 10px 6px;
      box-shadow: inset 0 0 22px rgba(0,0,0,.55);
    }
    .band { margin-bottom: 7px; }
    .fields { display: none; }
    .digits {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .digits > :nth-child(n + 3) { display: none; }
    .fields span, .colon {
      color: #d5dde4;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-align: center;
    }
    .colon { font-size: 1.35rem; line-height: 1; align-self: center; }
    .cell, .mark {
      display: flex;
      justify-content: center;
      gap: 0;
      min-width: 0;
      padding: 3px 2px 1px;
      background: #07090b;
      border: 1px solid #46515b;
      text-decoration: none;
    }
    .mark { background: transparent; border-color: transparent; }
    .seg { width: 36px; height: 62px; display: block; }
    .seg line { fill: none; stroke-width: 6; stroke-linecap: round; }
    .seg .off { display: none; }
    .red .seg { filter: drop-shadow(0 0 1px #ff3a18); }
    .green .seg { filter: drop-shadow(0 0 1px #3dff68); }
    .yellow .seg { filter: drop-shadow(0 0 1px #ffe14a); }
    .red .on { stroke: #ff3a18; }
    .red .off { stroke: rgba(255, 58, 24, 0.16); }
    .green .on { stroke: #3dff68; }
    .green .off { stroke: rgba(61, 255, 104, 0.14); }
    .yellow .on { stroke: #ffe14a; }
    .yellow .off { stroke: rgba(255, 225, 74, 0.16); }
    .caption {
      display: table;
      margin: 3px auto 0;
      padding: 0 8px;
      background: #101318;
      color: #d5dde4;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-decoration: none;
    }
    .screen-foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px solid rgba(213, 221, 228, 0.28);
      color: #d5dde4;
      font-size: 12px;
      letter-spacing: 0.14em;
    }
    .screen-foot a { color: inherit; text-decoration: none; }
    .screen-foot a:hover, .caption:hover, .cell:hover { filter: brightness(1.25); }
    .case {
      position: relative;
      width: 280px;
      flex: 0 0 auto;
      padding: 32px 16px 18px;
      background: linear-gradient(165deg, #f3ebe1 0%, #d8cec2 28%, #b7ab9e 62%, #e4d9cc 100%);
      border-radius: 4px;
      box-shadow: 0 18px 28px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.75);
    }
    .slot {
      position: absolute;
      top: 11px;
      left: 50%;
      width: 38%;
      height: 11px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #c45656, #8d3030);
      border-radius: 1px;
      box-shadow: inset 0 2px 2px rgba(0,0,0,.35);
    }
    .port {
      position: relative;
      aspect-ratio: 4 / 5;
      border-radius: 34px;
      border: 14px solid #121212;
      background:
        radial-gradient(circle at 50% 46%, #f4f0ff 0%, #c4b4ff 18%, #6e59c9 46%, #32256f 74%, #1b1244 100%);
      box-shadow: inset 0 0 24px rgba(20, 0, 40, .45), 0 0 0 2px #6d655c;
      overflow: hidden;
    }
    .port svg.conduit { position: absolute; inset: 0; width: 100%; height: 100%; }
    .rail {
      position: absolute;
      left: 16%;
      right: 16%;
      bottom: 26%;
      height: 11px;
      background: linear-gradient(180deg, #8a5340, #5c3426);
      box-shadow: 0 1px 0 rgba(255,255,255,.28);
    }
    .screw {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background:
        linear-gradient(90deg, transparent 46%, #2a2a2a 46% 54%, transparent 54%),
        radial-gradient(circle at 35% 35%, #fff, #8a8a8a 55%, #222);
    }
    .ask {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: min(1040px, 100%);
      padding: 10px 12px 10px 16px;
      background: linear-gradient(180deg, #2a2118, #16110d);
      border: 1px solid #6a5340;
      box-shadow: 0 10px 18px rgba(0,0,0,.28);
    }
    .ask-title {
      margin: 0;
      color: #ffe14a;
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .ask-actions { display: flex; gap: 8px; }
    .ask-actions button, .ask-actions a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 72px;
      height: 64px;
      margin: 0;
      padding: 6px 4px;
      border: 1px solid #8a6a32;
      background: #100e0c;
      color: #ffe14a;
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
    }
    .ask-actions button:hover, .ask-actions a:hover { color: #fff; border-color: #ffe14a; }
    .ask-actions svg { width: 26px; height: 26px; display: block; }
    .ask-actions button[data-state="copied"] { color: #3dff68; border-color: #3dff68; }
    .ask-actions button[data-state="failed"] { color: #ff3a18; border-color: #ff3a18; }
    @media (max-width: 900px) {
      .scene { justify-content: flex-start; }
      .bench { flex-direction: column; align-items: stretch; }
      .circuit { width: 100%; }
      .case { width: min(280px, 100%); margin: 0 auto; }
      .digits > :nth-child(n + 2) { display: none; }
      .seg { width: 34px; height: 58px; }
      .cell { padding: 6px 0 4px; }
      .ask { flex-direction: column; align-items: stretch; text-align: center; }
      .ask-actions { justify-content: center; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true">
    <filter id="segglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tubeglow" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="420">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </svg>

          area.value = promptText;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.left = "-9999px";
          document.body.appendChild(area);
          area.select();
          ok = document.execCommand("copy");
          area.remove();
        } catch (fallbackError) {
          ok = false;
        }
      }
      copyWord.textContent = ok ? "Copied" : "Copy failed";
      copyButton.dataset.state = ok ? "copied" : "failed";
      window.clearTimeout(copyButton._timer);
      copyButton._timer = window.setTimeout(() => {
        copyWord.textContent = "Copy";
        delete copyButton.dataset.state;
      }, 2000);
    });
  </script>
</body>
</html>
